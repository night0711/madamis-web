   "html": "<p>父・潮田 修は、汐見で小さな画塾を開いていた絵本作家。5年前に亡くなった。父には、本にならなかった絵本が一冊ある。題名は『<strong>ゆきのよるのコンビニ</strong>』。雪の夜の丸山商店を描いた、家族しか知らない絵本だ。原画の一枚は丸山商店に贈ったと聞いている。</p><p>二十年あまり前、父の画塾の元生徒・鷹野 迅の映画『雪灯』を観て、息が止まった。いちばん有名な場面が、父の絵本のあの場面にそっくりだったから。父は何も言わなかった。それがかえって悔しかった。</p><p>十年前（2016年）、『雪灯』の海外公開が決まり、英語字幕の翻訳者を探していると聞いて、旧姓のまま名乗り出た。いつか本人に問いただすために。それから鷹野作品の英語字幕は、ずっとあなたが訳している。やりとりはメールだけで、鷹野と会ったことはない。鷹野があなたを指名し続ける理由は、わからない。今夜の仕事も『雪灯』英語字幕の改訂版だ。</p>"
